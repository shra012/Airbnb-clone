        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - propertyId
                - startDate
                - endDate
                - guests
              properties:
                propertyId:
                  type: integer
                  minimum: 1
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                guests:
                  type: integer
                  minimum: 1
                notes:
                  type: string
            example:
              propertyId: 12
              startDate: 2025-07-01
              endDate: 2025-07-06
              guests: 4
              notes: Family vacation
      responses:
        '201':
          description: Booking created in pending state
          content:
