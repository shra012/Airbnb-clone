openapi: 3.0.3
info:
  title: Airbnb Lab Backend API
  version: 0.2.0
servers:
  - url: http://localhost:4000/api
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: airbnb.sid
  schemas:
    ApiResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - TRAVELER
            - OWNER
    TravelerSignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        about:
          type: string
        city:
          type: string
        state:
          type: string
          description: Two-letter state or region abbreviation
        country:
          type: string
        languages:
          type: string
        gender:
          type: string
        avatarUrl:
          type: string
          format: uri
    OwnerSignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        about:
          type: string
        location:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
          format: uri
        company:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    OwnerPropertyRequest:
      type: object
      required:
        - title
        - description
        - propertyType
        - addressLine1
        - city
        - state
        - country
        - pricePerNight
        - bedrooms
        - bathrooms
        - maxGuests
      properties:
        title:
          type: string
        description:
          type: string
        propertyType:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        pricePerNight:
          type: number
        cleaningFee:
          type: number
          minimum: 0
        bedrooms:
          type: integer
          minimum: 1
        bathrooms:
          type: integer
          minimum: 1
        maxGuests:
          type: integer
          minimum: 1
        checkInTime:
          type: string
          example: "15:00"
        checkOutTime:
          type: string
          example: "11:00"
        amenities:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                format: uri
              caption:
                type: string
              isCover:
                type: boolean
        availabilities:
          type: array
          items:
            type: object
            required:
              - startDate
              - endDate
            properties:
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
              isBlocked:
                type: boolean
              reason:
                type: string
    OwnerDashboard:
      type: object
      required:
        - summary
        - properties
        - recentRequests
        - recentBookings
      properties:
        summary:
          type: object
          required:
            - totalProperties
            - totalBookings
            - pendingRequests
            - upcomingBookings
          properties:
            totalProperties:
              type: integer
            totalBookings:
              type: integer
            pendingRequests:
              type: integer
            upcomingBookings:
              type: integer
        properties:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              city:
                type: string
              state:
                type: string
              country:
                type: string
              pricePerNight:
                type: number
              bedrooms:
                type: integer
              bathrooms:
                type: integer
              maxGuests:
                type: integer
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        recentRequests:
          type: array
          items:
            $ref: '#/components/schemas/OwnerBookingSummary'
        recentBookings:
          type: array
          items:
            $ref: '#/components/schemas/OwnerBookingSummary'
    OwnerBookingSummary:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        guests:
          type: integer
        createdAt:
          type: string
          format: date-time
        property:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
        traveler:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
    OwnerBookings:
      type: object
      required:
        - bookings
        - counts
      properties:
        bookings:
          type: object
          properties:
            pending:
              type: array
              items:
                $ref: '#/components/schemas/OwnerBookingSummary'
            accepted:
              type: array
              items:
                $ref: '#/components/schemas/OwnerBookingSummary'
            cancelled:
              type: array
              items:
                $ref: '#/components/schemas/OwnerBookingSummary'
        counts:
          type: object
          properties:
            pending:
              type: integer
            accepted:
              type: integer
            cancelled:
              type: integer
    OwnerProperty:
      allOf:
        - $ref: '#/components/schemas/OwnerPropertyRequest'
        - type: object
          properties:
            id:
              type: integer
            ownerId:
              type: integer
            amenities:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  label:
                    type: string
            photos:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  url:
                    type: string
                    format: uri
                  caption:
                    type: string
                  isCover:
                    type: boolean
            availabilities:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  startDate:
                    type: string
                    format: date-time
                  endDate:
                    type: string
                    format: date-time
                  isBlocked:
                    type: boolean
                  reason:
                    type: string
paths:
  /auth/traveler/signup:
    post:
      tags:
        - Auth
      summary: Traveler signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelerSignupRequest'
            example:
              name: Jane Doe
              email: jane@example.com
              password: Str0ngPass!2025
              city: Lisbon
              country: Portugal
      responses:
        '201':
          description: Traveler registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
  /auth/owner/signup:
    post:
      tags:
        - Auth
      summary: Owner signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerSignupRequest'
            example:
              name: Lucas Moreno
              email: lucas@example.com
              password: Str0ngPass!2025
              location: Lisbon, Portugal
              company: Moreno Stays
      responses:
        '201':
          description: Owner registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: lucas@example.com
              password: Str0ngPass!2025
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Session cookie (airbnb.sid)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current session user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /owner/dashboard:
    get:
      tags:
        - Owner
      summary: Get owner dashboard summary
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OwnerDashboard'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /owner/bookings:
    get:
      tags:
        - Owner
      summary: List bookings for owner properties grouped by status
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Grouped booking list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OwnerBookings'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /owner/properties:
    post:
      tags:
        - Owner
      summary: Create a new property listing
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerPropertyRequest'
            example:
              title: Oceanview Villa
              description: Five minutes from the beach
              propertyType: Villa
              addressLine1: 123 Coast Road
              city: Lisbon
              state: LX
              country: Portugal
              pricePerNight: 325
              bedrooms: 4
              bathrooms: 3
              maxGuests: 8
              amenities:
                - Pool
                - Wi-Fi
              photos:
                - url: https://example.com/pool.jpg
                  isCover: true
              availabilities:
                - startDate: 2025-06-01
                  endDate: 2025-06-15
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OwnerProperty'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
