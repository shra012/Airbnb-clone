openapi: 3.0.3
info:
  title: Airbnb Lab Backend API
  version: 0.1.0
servers:
  - url: http://localhost:4000/api
paths:
  /auth/traveler/signup:
    post:
      summary: Traveler signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Traveler registered
  /auth/login:
    post:
      summary: Login endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Login successful
