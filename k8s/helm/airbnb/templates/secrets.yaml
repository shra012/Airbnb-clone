{{- if .Values.secrets.mongo.sessionUri }}
apiVersion: v1
kind: Secret
metadata:
  name: mongo-session
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_SESSION_URI: {{ .Values.secrets.mongo.sessionUri | quote }}
{{- end }}
---
{{- if .Values.secrets.supabase.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: supabase-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.supabase.databaseUrl | quote }}
{{- end }}
---
{{- if .Values.secrets.session.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: session-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.session.secret | quote }}
{{- end }}
---
{{- with .Values.secrets.agent }}
{{- if or .openaiApiKey .anthropicApiKey .tavilyApiKey .weatherApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-llm
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "airbnb.labels" $ | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .openaiApiKey | quote }}
  OPENAI_MODEL_NAME: {{ .openaiModelName | quote }}
  ANTHROPIC_API_KEY: {{ .anthropicApiKey | quote }}
  ANTHROPIC_MODEL_NAME: {{ .anthropicModelName | quote }}
  TAVILY_API_KEY: {{ .tavilyApiKey | quote }}
  WEATHER_API_KEY: {{ .weatherApiKey | quote }}
{{- end }}
{{- end }}
