{{- if .Values.travelerService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.travelerService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.travelerService.name }}
    {{- include "airbnb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.travelerService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.travelerService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.travelerService.name }}
    spec:
      containers:
      - name: {{ .Values.travelerService.name }}
        image: {{ include "airbnb.image" (dict "Values" .Values "image" .Values.travelerService.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.travelerService.service.targetPort }}
          name: http
        env:
        - name: PORT
          value: {{ .Values.travelerService.env.PORT | quote }}
        - name: NODE_ENV
          value: {{ .Values.travelerService.env.NODE_ENV | quote }}
        - name: KAFKA_BROKER_URL
          value: {{ .Values.kafka.brokerUrl | quote }}
        - name: MONGO_SESSION_URI
          valueFrom:
            secretKeyRef:
              name: mongo-session
              key: MONGO_SESSION_URI
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-postgres
              key: DATABASE_URL
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: session-secret
              key: SESSION_SECRET
        resources:
          {{- toYaml .Values.travelerService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.travelerService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.travelerService.name }}
    {{- include "airbnb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.travelerService.service.type }}
  ports:
  - port: {{ .Values.travelerService.service.port }}
    targetPort: {{ .Values.travelerService.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.travelerService.name }}
{{- end }}
