{{- if .Values.propertyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.propertyService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.propertyService.name }}
spec:
  replicas: {{ .Values.propertyService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.propertyService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.propertyService.name }}
    spec:
      containers:
      - name: {{ .Values.propertyService.name }}
        image: {{ include "airbnb.image" (dict "Values" .Values "image" .Values.propertyService.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.propertyService.service.targetPort }}
        env:
        - name: PORT
          value: {{ .Values.propertyService.env.PORT | quote }}
        - name: NODE_ENV
          value: {{ .Values.propertyService.env.NODE_ENV | quote }}
        - name: KAFKA_BROKER_URL
          value: {{ .Values.kafka.brokerUrl | quote }}
        envFrom:
        - secretRef:
            name: mongo-session
        - secretRef:
            name: supabase-postgres
        - secretRef:
            name: session-secret
        resources:
          {{- toYaml .Values.propertyService.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.propertyService.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.propertyService.service.type }}
  ports:
  - port: {{ .Values.propertyService.service.port }}
    targetPort: {{ .Values.propertyService.service.targetPort }}
  selector:
    app: {{ .Values.propertyService.name }}
{{- end }}
