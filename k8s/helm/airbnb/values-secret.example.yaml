# Local-only secrets override. Copy to values-secret.yaml (gitignored) and fill real values.
secrets:
  mongo:
    sessionUri: "<mongo-session-uri>"
  supabase:
    databaseUrl: "<supabase-database-url>"
  session:
    secret: "<session-secret>"
  agent:
    openaiApiKey: "<openai-api-key>"
    openaiModelName: "gpt-4o-mini"
    anthropicApiKey: "<anthropic-api-key>"
    anthropicModelName: "claude-sonnet-4-5"
    tavilyApiKey: "<tavily-api-key>"
    weatherApiKey: "<weather-api-key>"
