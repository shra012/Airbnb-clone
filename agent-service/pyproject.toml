[project]
name = "agent-service"
version = "0.1.0"
description = "AI concierge microservice for the Airbnb Lab project."
authors = [
    { name = "Airbnb Lab" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "langchain>=0.3.2,<0.4.0",
    "langgraph>=1.0.0,<2.0.0",
    "langsmith>=0.1,<0.5",
    "langchain-openai>=0.1,<0.3",
    "langchain-anthropic>=0.1,<0.3",
    "langchain-community>=0.3.2,<0.4.0",
    "openai>=1.51,<3.0",
    "tavily-python>=0.3,<0.4",
    "httpx>=0.27,<0.28",
    "supabase>=2.5,<3.0",
    "asyncpg>=0.29,<0.31",
    "python-dotenv>=1.0,<2.0",
    "json-repair>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<0.9",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
